<rect width="1280" height="560" rx="20" fill="url(#grid)"/>
<circle cx="200" cy="280" r="320" fill="url(#redGlow)"/>
<circle cx="1050" cy="180" r="250" fill="url(#dimGlow)"/>

<!-- Decorative mask-like geometric shapes (left side) -->
