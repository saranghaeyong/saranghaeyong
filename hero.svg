<path class="corner" d="M1228 72V52H1208" fill="none" stroke="#e2383f" stroke-width="2" stroke-linecap="round" style="animation-delay:.3s"/>
<path class="corner" d="M52 488V508H72" fill="none" stroke="#e2383f" stroke-width="2" stroke-linecap="round" style="animation-delay:.4s"/>
<path class="corner" d="M1228 488V508H1208" fill="none" stroke="#e2383f" stroke-width="2" stroke-linecap="round" style="animation-delay:.5s"/>

