<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030407"/>
      <stop offset="50%" stop-color="#0a050c"/>
      <stop offset="100%" stop-color="#140206"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="50%" stop-color="#FF526B"/>
      <stop offset="100%" stop-color="#FF8A80"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#9C27B0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9C27B0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.03); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    .pulsing-bg { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    .floating { animation: float 4s ease-in-out infinite; }
    .main-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 56px; letter-spacing: 8px; fill: #FFFFFF; }
    .sub-title { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 600; font-size: 16px; letter-spacing: 6px; fill: #FF526B; }
    .badge-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 500; font-size: 13px; letter-spacing: 3px; fill: #9CA3AF; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow1)" class="pulsing-bg"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow2)"/>

  <!-- Cybernetic Grid Overlay -->
  <g stroke="#FF1744" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M150 0V360M300 0V360M450 0V360M600 0V360M750 0V360M900 0V360M1050 0V360"/>
  </g>

  <!-- Glowing Corner Borders -->
  <g stroke="url(#neon)" stroke-width="2" fill="none" opacity="0.8">
    <path d="M40 70V40H70"/>
    <path d="M1160 70V40H1130"/>
    <path d="M40 290V320H70"/>
    <path d="M1160 290V320H1130"/>
  </g>

  <!-- Decorative Circuit Nodes -->
  <g fill="#FF1744" opacity="0.6">
    <circle cx="70" cy="40" r="3"/>
    <circle cx="1130" cy="40" r="3"/>
    <circle cx="70" cy="320" r="3"/>
    <circle cx="1130" cy="320" r="3"/>
    <circle cx="600" cy="45" r="2.5" fill="#FFF"/>
  </g>

  <!-- Central Content -->
  <g class="floating" transform="translate(0, 5)">
    <!-- Top HUD Tag -->
    <text x="600" y="90" text-anchor="middle" class="badge-text">&lt; /&gt; SYSTEM ONLINE • GITHUB @saranghaeyong</text>
    
    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" class="main-title" filter="url(#shadow)">SARANG R N</text>

    <!-- Subtitle / Role -->
    <text x="600" y="215" text-anchor="middle" class="sub-title">// SOFTWARE DEVELOPER &amp; MCA GRADUATE</text>

    <!-- Bottom Bio Pill -->
    <rect x="360" y="245" width="480" height="38" rx="19" fill="#110508" stroke="#FF1744" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="600" y="269" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" letter-spacing="3" fill="#E5E7EB">BUILDING IMMERSIVE UI &amp; OPEN SOURCE TOOLS</text>
  </g>

  <!-- Side Glowing Accents -->
  <line x1="40" y1="180" x2="80" y2="180" stroke="#FF1744" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="1120" y1="180" x2="1160" y2="180" stroke="#FF1744" stroke-width="2" stroke-opacity="0.5"/>
</svg>