<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050204"/>
      <stop offset="100%" stop-color="#0C0307"/>
    </linearGradient>
    <linearGradient id="footLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF1744" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .footer-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #9CA3AF; letter-spacing: 3px; }
    .signature { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 24px; fill: #FFFFFF; letter-spacing: 6px; }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .heart { animation: heartbeat 2s infinite; fill: #FF1744; }
  </style>
  <rect width="1200" height="180" rx="16" fill="url(#footBg)" stroke="#FF1744" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="200" y1="40" x2="1000" y2="40" stroke="url(#footLine)" stroke-width="1"/>
  
  <text x="600" y="80" text-anchor="middle" class="signature">SARANG R N</text>
  <text x="600" y="110" text-anchor="middle" class="footer-text">// DESIGNED WITH <tspan class="heart">♥</tspan> &amp; CLEAN CODE • 2026</text>
  <text x="600" y="140" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6B7280" letter-spacing="2">GITHUB.COM/SARANGHAEYONG</text>
</svg>