<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Connect with me">
<title>Connect — Deadpool Developer</title>
<defs>
<style type="text/css"><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@keyframes pulseRing{0%{r:16;opacity:.7}100%{r:36;opacity:0}}
.arrow{animation:nudge 1.8s ease-in-out infinite}
.fi{animation:fadeIn .6s ease forwards}
.pc{opacity:0;animation:pop .5s cubic-bezier(.2,.8,.3,1.2) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.9)}70%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important;transform:none!important}}
]]></style>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#141414"/>
  <stop offset="100%" stop-color="#0e0e0e"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#e2383f"/>
  <stop offset="100%" stop-color="#c41e3a"/>
</linearGradient>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#e2383f" stop-opacity=".4"/>
  <stop offset="100%" stop-color="#2a2a2a" stop-opacity=".15"/>
</linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
  <circle cx="12" cy="12" r=".7" fill="rgba(226,56,63,.05)"/>
</pattern>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1280" height="400" rx="22" fill="url(#panel)"/>
<rect width="1280" height="400" rx="22" fill="url(#dots)"/>
<rect x=".75" y=".75" width="1278.5" height="398.5" rx="21.25" fill="none" stroke="url(#border)" stroke-width="1.5"/>

<!-- Header -->
<g class="fi" style="animation-delay:.1s">
  <rect x="48" y="40" width="4" height="28" rx="2" fill="url(#accent)"/>
  <text x="64" y="62" font-size="12" fill="#e2383f" font-weight="bold" letter-spacing="2.5">// CONNECT</text>
  <text x="64" y="96" font-size="30" fill="#f0f0f0" font-weight="bold" letter-spacing="-.5">Let's Build Something Together</text>
  <text x="64" y="122" font-size="15" fill="#6b7280">I'm always open to new opportunities and collaborations.</text>
</g>

<!-- GitHub card -->
<g class="pc" style="animation-delay:.3s">
  <rect x="48" y="150" width="260" height="100" rx="14" fill="rgba(255,255,255,.02)" stroke="#2a2a2a"/>
  <rect x="48" y="150" width="260" height="100" rx="14" fill="none" stroke="#e2383f" stroke-opacity="0">
    <animate attributeName="stroke-opacity" values="0;.6;0;0" keyTimes="0;.05;.18;1" dur="6s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="64" y="166" width="44" height="44" rx="10" fill="rgba(255,255,255,.06)"/>
  <!-- GitHub icon -->
  <path d="M86 88c-4.4 0-8-3.6-8-8 0-3.5 2.3-6.5 5.4-7.6-.4-1.7-.8-4.4-.2-6.4 0 0 2-.6 6.6 2.5 1.9-.5 4-.8 6-.8s4.1.3 6 .8c4.6-3.1 6.6-2.5 6.6-2.5.6 2 .2 4.7-.2 6.4 3.1 1.1 5.4 4.1 5.4 7.6 0 4.4-3.6 8-8 8-3.7 0-6.3-2.5-7.4-4.7l-2.4-3.2-2.4 3.2C76.3 85.5 73.7 88 70 88z" transform="translate(68,170) scale(1.2)" fill="#e6edf3"/>
  <text x="122" y="188" font-size="15" fill="#f0f0f0" font-weight="bold">GitHub</text>
  <text x="122" y="208" font-size="12" fill="#6b7280">@saranghaeyong</text>
  <text x="280" y="200" text-anchor="end" font-size="16" fill="#e2383f" class="arrow">→</text>
</g>

<!-- LinkedIn card -->
<g class="pc" style="animation-delay:.45s">
  <rect x="332" y="150" width="260" height="100" rx="14" fill="rgba(255,255,255,.02)" stroke="#2a2a2a"/>
  <rect x="348" y="166" width="44" height="44" rx="10" fill="rgba(10,102,194,.1)" stroke="#0a66c2" stroke-opacity=".4"/>
  <!-- LinkedIn icon -->
  <text x="356" y="198" font-size="22" fill="#0a66c2" font-weight="bold" font-family="Arial,sans-serif">in</text>
  <text x="406" y="188" font-size="15" fill="#f0f0f0" font-weight="bold">LinkedIn</text>
  <text x="406" y="208" font-size="12" fill="#6b7280">TODO_LINKEDIN_URL</text>
  <text x="564" y="200" text-anchor="end" font-size="16" fill="#0a66c2" class="arrow">→</text>
</g>

<!-- Portfolio card -->
<g class="pc" style="animation-delay:.6s">
  <rect x="616" y="150" width="260" height="100" rx="14" fill="rgba(255,255,255,.02)" stroke="#2a2a2a"/>
  <rect x="632" y="166" width="44" height="44" rx="10" fill="rgba(226,56,63,.08)" stroke="#e2383f" stroke-opacity=".3"/>
  <!-- Globe icon -->
  <circle cx="654" cy="188" r="12" fill="none" stroke="#e2383f" stroke-width="1.5" opacity=".7"/>
  <ellipse cx="654" cy="188" rx="5" ry="12" fill="none" stroke="#e2383f" stroke-width="1" opacity=".5"/>
  <line x1="642" y1="188" x2="666" y2="188" stroke="#e2383f" stroke-width="1" opacity=".5"/>
  <text x="690" y="188" font-size="15" fill="#f0f0f0" font-weight="bold">Portfolio</text>
  <text x="690" y="208" font-size="12" fill="#6b7280">pbgm.vercel.app</text>
  <text x="848" y="200" text-anchor="end" font-size="16" fill="#e2383f" class="arrow">→</text>
</g>

<!-- Email card -->
<g class="pc" style="animation-delay:.75s">
  <rect x="900" y="150" width="260" height="100" rx="14" fill="rgba(255,255,255,.02)" stroke="#2a2a2a"/>
  <rect x="916" y="166" width="44" height="44" rx="10" fill="rgba(234,67,53,.08)" stroke="#ea4335" stroke-opacity=".3"/>
  <!-- Envelope icon -->
  <rect x="924" y="176" width="28" height="20" rx="3" fill="none" stroke="#ea4335" stroke-width="1.5" opacity=".8"/>
  <path d="M924 176 l14 12 l14 -12" fill="none" stroke="#ea4335" stroke-width="1.5" opacity=".8"/>
  <text x="974" y="188" font-size="15" fill="#f0f0f0" font-weight="bold">Email</text>
  <text x="974" y="208" font-size="12" fill="#6b7280">TODO_EMAIL</text>
  <text x="1132" y="200" text-anchor="end" font-size="16" fill="#ea4335" class="arrow">→</text>
</g>

<!-- Divider -->
<g class="fi" style="animation-delay:.9s">
  <line x1="48" y1="290" x2="1232" y2="290" stroke="#2a2a2a" stroke-width="1"/>
</g>

<!-- Status message -->
<g class="fi" style="animation-delay:1s">
  <circle cx="72" cy="320" r="4" fill="#4ade80" opacity=".8">
    <animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="88" y="324" font-size="13" fill="#cdd6e0">Open to full-time roles · Remote or Kerala-based · Fresher eager to contribute</text>
</g>

<!-- Closing -->
<g class="fi" style="animation-delay:1.1s">
  <text x="640" y="360" text-anchor="middle" font-size="13" fill="#4a4a4a" letter-spacing="1">
    “I don't need luck. I have <tspan fill="#e2383f" font-weight="bold">commit history</tspan>.”
  </text>
</g>

<!-- Decorative accents -->
<g transform="translate(1200, 80)" opacity=".1" class="fi" style="animation-delay:1.2s">
  <path d="M0 -20 Q14 -34 28 -20 Q34 -6 28 10 Q14 24 0 20 Q-14 24 -28 10 Q-34 -6 -28 -20 Q-14 -34 0 -20Z" fill="none" stroke="#e2383f" stroke-width="1.5"/>
</g>
<g transform="translate(100, 370)" opacity=".08" class="fi" style="animation-delay:1.3s">
  <path d="M0 -14 Q10 -24 20 -14 Q24 -4 20 6 Q10 16 0 14 Q-10 16 -20 6 Q-24 -4 -20 -14 Q-10 -24 0 -14Z" fill="none" stroke="#e2383f" stroke-width="1.5"/>
</g>
</svg>
